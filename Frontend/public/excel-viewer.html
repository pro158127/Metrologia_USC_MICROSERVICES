<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Visor Excel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/css/pluginsCss.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/plugins.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/css/luckysheet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/assets/iconfont/iconfont.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #luckysheet-container { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="luckysheet-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/js/plugin.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/luckysheet.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luckyexcel@latest/dist/luckyexcel.umd.js"></script>

  <script>
    // Esperar a que las librerías estén disponibles
    function waitForLibraries(callback) {
      if (window.luckysheet && window.LuckyExcel) {
        callback();
      } else {
        setTimeout(() => waitForLibraries(callback), 50);
      }
    }

    waitForLibraries(function() {
      let activeVariable = null;
      let savedMappings = [];
      let luckysheetReady = false;

      function getColumnLetter(colIndex) {
        let letter = '';
        let c = colIndex;
        while (c >= 0) {
          letter = String.fromCharCode((c % 26) + 65) + letter;
          c = Math.floor(c / 26) - 1;
        }
        return letter;
      }

      function hexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r},${g},${b},${alpha})`;
      }

      function applyMappingStyle(mapping) {
        if (!luckysheetReady) return;
        const sheetIndex = luckysheet.getSheetIndex(mapping.sheetName);
        if (sheetIndex === -1) return;
        const color = mapping.color || activeVariable?.color || '#3b82f6';
        const rgba = hexToRgba(color, 0.2);
        if (mapping.type === 'TABLE_FIELD' && mapping.mappedRange) {
          const { startRow, endRow, startColumn, endColumn } = mapping.mappedRange;
          luckysheet.setRangeFormat(
            { row_index: startRow, col_index: startColumn, row: endRow - startRow + 1, col: endColumn - startColumn + 1 },
            { bg: rgba },
            { order: sheetIndex }
          );
        } else if (mapping.type === 'SINGLE_FIELD' && mapping.mappedRange) {
          const { startRow, startColumn } = mapping.mappedRange;
          luckysheet.setRangeFormat(
            { row_index: startRow, col_index: startColumn, row: 1, col: 1 },
            { bg: rgba },
            { order: sheetIndex }
          );
        }
      }

      function highlightAllMappings() {
        savedMappings.forEach(m => applyMappingStyle(m));
      }

      function loadExcel(fileUrl) {
        console.log('IFRAME: Llamando a LuckyExcel con:', fileUrl);
        LuckyExcel.transformExcelToLucky(
          fileUrl,
          function(exportJson) {
            window.luckysheet.create({
              container: document.getElementById('luckysheet-container'),
              data: exportJson.sheets,
              title: exportJson.info.name || 'Excel',
              lang: 'es',
              showtoolbar: false,
              showinfobar: false,
              showsheetbar: true,
              showstatisticBar: false,
              allowUpdate: false,
              allowEdit: false,
              enableAddRow: false,
              enableAddCol: false,
              sheetFormulaBar: false,
              cellRangeAfter(range, sheetIndex) {
                if (!activeVariable) return;
                const sheet = luckysheet.getSheet(sheetIndex);
                const sheetName = sheet.name;
                const startRow = range.row[0], endRow = range.row[1] ?? startRow;
                const startCol = range.column[0], endCol = range.column[1] ?? startCol;
                const mapping = {
                  variableId: activeVariable.id,
                  sheetName,
                  row: startRow,
                  col: startCol,
                  type: activeVariable.type || 'SINGLE_FIELD',
                  mappedRange: { startRow, endRow, startColumn: startCol, endColumn: endCol },
                  cellAddress: activeVariable.type === 'TABLE_FIELD'
                    ? `${getColumnLetter(startCol)}${startRow+1}:${getColumnLetter(endCol)}${endRow+1}`
                    : `${getColumnLetter(startCol)}${startRow+1}`,
                  color: activeVariable.color,
                };
                window.parent.postMessage({ type: 'CELL_SELECTED', mapping }, '*');
                applyMappingStyle(mapping);
              }
            });
            luckysheetReady = true;
            setTimeout(highlightAllMappings, 500);
          },
          function(err) {
            console.error('Error al cargar Excel:', err);
            document.body.innerHTML = '<p style="padding:20px;">Error al cargar el archivo.</p>';
          }
        );
      }

      // Escuchar mensajes del padre
      window.addEventListener('message', function(event) {
        const msg = event.data;
        if (!msg || !msg.type) return;

        switch (msg.type) {
          case 'LOAD_EXCEL':
            console.log('IFRAME: Recibido LOAD_EXCEL con fileUrl:', msg.fileUrl);
            if (msg.fileUrl) {
              loadExcel(msg.fileUrl);
            }
            break;
          case 'SET_ACTIVE_VARIABLE':
            activeVariable = msg.variable;
            break;
          case 'CLEAR_ACTIVE_VARIABLE':
            activeVariable = null;
            break;
          case 'SET_MAPPED_RANGES':
            savedMappings = msg.mappings || [];
            if (luckysheetReady) {
              highlightAllMappings();
            }
            break;
        }
      });
    });
  </script>
</body>
</html>
