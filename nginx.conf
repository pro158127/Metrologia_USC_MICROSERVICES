    events {
        worker_connections 1024;
    }

    http {
        # 🔥 NUEVO: Aumentar el límite de tamaño para evitar errores al subir archivos al servidor
        client_max_body_size 100M;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen 80;

            # 🔥 NUEVO 1: Ruta para descargas de MinIO (S3 API)
            # Nginx intercepta todo lo que empiece con tu BUCKET_NAME
         location /documentos-metrologia/ {
            proxy_pass http://minio-storage:9000;
            
            # El túnel de Microsoft altera el Host. Forzamos a pasar el original.
            proxy_set_header Host $http_host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 🚀 ESTO ES CLAVE PARA TÚNELES: Preserva el dominio original para la firma AWS
            proxy_set_header X-Forwarded-Host $http_host;
            
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # 🔥 CORRECCIÓN 2: Consola UI de MinIO (Puerto 9001)
        location /minio-ui/ {
            # Se enruta al puerto 9001 que es la consola web
            proxy_pass http://minio-storage:9001/;
            
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 🚀 ESTO ES CLAVE PARA EL LOGIN: MinIO Console usa WebSockets para la sesión
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # 🚀 Evita el "Login Inválido" eliminando el chequeo de origen del túnel
            proxy_set_header Origin ''; 
        }

            # 🔥 NUEVO 2: Consola UI de MinIO (Opcional, para que entres a ver tus archivos)


            # 1. EXCEPCIÓN NEXTAUTH: Todo lo que sea /api/auth va al FRONTEND
            location /api/auth/ {
                proxy_pass http://frontend:3000/api/auth/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            # 2. RESTO DE LA API: Todo lo demás de /api/ va al BACKEND (Fastify)
            location /api/ {
                proxy_pass http://backend:3001/api/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            # 3. WEBSOCKETS: Va al BACKEND con headers especiales
       location /socket.io/ {
                # 🔥 CORRECCIÓN: Quitar "/socket.io/" del final. 
                # Nginx ahora pasará la URL intacta con sus query params.
                proxy_pass http://backend:3001;
                
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                
                # Para evitar problemas con DevTunnels, forzamos el Host original
                proxy_set_header Host $http_host; 
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            # 4. TRÁFICO NORMAL: Páginas web van al FRONTEND (Next.js)
            location / {
                proxy_pass http://frontend:3000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                
                # Soporte para el Hot Reload de Next.js en desarrollo
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
            }
        }
    }