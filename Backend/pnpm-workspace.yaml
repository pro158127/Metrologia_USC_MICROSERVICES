# Definición de la carpeta raíz del Backend
packages:
  - '.'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true

# Lista blanca oficial de pnpm v10+ para compilar binarios C++/Rust nativos
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - esbuild
  - prisma
