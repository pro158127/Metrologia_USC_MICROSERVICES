name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL_LOCAL: postgresql://ci:ci@127.0.0.1:5432/metrologia_ci
      DATABASE_URL_AWS: postgresql://ci:ci@127.0.0.1:5432/metrologia_ci
      AUTH_SECRET: ci-only-secret-not-valid-outside-this-job
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
      NEXT_PUBLIC_MINIO_URL: http://localhost:9000
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: ci-only-user
      MINIO_SECRET_KEY: ci-only-password
      MINIO_BUCKET_NAME: ci-documents
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            Backend/pnpm-lock.yaml
            Frontend/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schemas
        run: |
          pnpm --filter backend exec prisma validate --schema=prisma/schema.prisma
          pnpm --filter metrologia exec prisma validate --schema=prisma/schema.prisma

      - name: Generate Prisma clients
        run: |
          pnpm --filter backend exec prisma generate --schema=prisma/schema.prisma
          pnpm --filter metrologia exec prisma generate --schema=prisma/schema.prisma

      - name: Backend unit and service tests
        run: pnpm --filter backend test

      - name: Build backend
        run: pnpm --filter backend build

      - name: Check frontend TypeScript
        run: pnpm --filter metrologia exec tsc --noEmit

      - name: Lint frontend
        id: frontend_lint
        continue-on-error: true
        run: pnpm --filter metrologia lint

      - name: Build frontend
        run: pnpm --filter metrologia build

      - name: Excel worker smoke test
        run: node scripts/test-excel-worker.cjs

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Enforce lint result
        if: ${{ !cancelled() }}
        run: test "${{ steps.frontend_lint.outcome }}" = "success"
